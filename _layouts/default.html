<?xml version="1.0" encoding="utf-8"?><!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <title>{{ page.title | default: site.title }}</title>
        <meta name="description" content="Andrew G Johnson.com: Software Engineer, Web Developer and Technologist" />
        <meta name="keywords" content="Andrew G Johnson, software engineer, web developer, technologist, Winnipeg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon32x32.png">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" />
        {% if jekyll.environment == "production" %}
            <link rel="stylesheet" href="/css/stylesheet.min.css?_={{ site.time | date: '%Y%m%d%H%M%S' }}" />
        {% else %}
            <link rel="stylesheet" href="/css/stylesheet.css" />
        {% endif %}
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css" integrity="sha512-nMJjQudb6RMMr08oY6YSfNlEWl1l8XWuoOwNvtWXrrgVs8MCR8AZBB1tEAO+ogiI93gXtG1XPmg+bAP5DochSA==" crossorigin="anonymous" />
    </head>
    <body>
        <div id="container">
            <header>
                <h1>
                    <strong>Andrew G Johnson</strong>
                    <small>Software Engineer • Web Developer • Technologist</small>
                    <img src="/andrew-g-johnson.jpg?_={{ site.time | date: '%Y%m%d%H%M%S' }}" alt="Andrew G Johnson" />
                </h1>
            </header>
            <main>
                {{ content }}
            </main>
            <footer>
                <p id="footer">
                    Powered by <a href="https://github.com/andrewgjohnson/www.andrewgjohnson.com" title="GitHub Pages">GitHub Pages</a> &#169; 2008–{{ site.time | date: '%Y' }}
                </p>
            </footer>
        </div>
        <div id="cover-image"></div>
    </body>
</html>
